# AWS and retraining configuration.
#
# Same rule as configs/model_serving.yaml: every key here is read by code. The
# repository runs end to end without AWS, so nothing in this file is loaded
# unless a script that talks to AWS is invoked.
#
# Every value can be overridden by an environment variable, because the same
# code runs on a laptop, inside a SageMaker Processing Job and on EC2, and those
# three should not need three different YAML files.

aws:
  # RESOLVED 2026-07-27: Singapore. This supersedes the us-east-1 default in
  # backend/app/services/dynamodb/user_activity_repository.py and the
  # ap-southeast-2 in PROJECT_PLAN.md; both have to be updated to match, because
  # a table in one region and a client pointed at another fails at call time,
  # and creating it twice costs money twice (MODEL_DESIGN_SPEC.md section 16.9).
  # Closest region to Vietnam, so it also gives the lowest latency to users.
  region: ap-southeast-1         # env: AWS_REGION
  bucket: movie-recommendation-fcaj   # env: MOVIE_REC_BUCKET

  # Prefixes inside the bucket.
  #
  # RESOLVED 2026-07-30 by listing the bucket rather than assuming: the tree is
  # organised by lifecycle stage at the root — `datasets/`, `training/`,
  # `models/`, `evaluation/`, `inference/`, `logs/`. An earlier revision of this
  # file pointed everything at `movie-recommender/dev/`, which does not exist on
  # the bucket; `push` would have grown a second parallel copy of a 1 GB tree
  # and `pull` would have found nothing and trained on an empty dataset.
  #
  # `datasets/raw|processed|serving` and `logs/` already hold data uploaded by
  # the web side. The rest are empty directory markers waiting for their first
  # write, which is what the mapping below fills.
  prefixes:
    raw: datasets/raw/
    processed: datasets/processed/
    # Shares `processed/` with the tables above, which is how the bucket was laid
    # out before this repository ever pushed to it. The cost is on `pull`, not on
    # `push`: a download copies everything under a prefix into the one local
    # directory the prefix maps to, so `data/processed` and `data/features` each
    # end up with all twelve files. Nothing breaks — every reader opens files by
    # name — but the retrain job transfers the 242 MB feature tables twice.
    features: datasets/processed/
    splits: training/
    # The lookup tables the engine reads to answer a request: the serving
    # catalogue and the two guest rankings. Kept out of `datasets/serving/`,
    # which holds the web side's DynamoDB exports — one JSONL per table, named
    # after the table rather than after anything this repository produces.
    # Sharing the prefix would mean neither side could tell which files are
    # theirs, and a `pull` would drag a 161 MB `users.jsonl` into data/serving.
    serving: inference/
    artifacts: models/
    events: datasets/exports/   # interaction exports, one JSONL per run
    reports: evaluation/
    # SageMaker model bundles, one `<version>/model.tar.gz` per deployed model.
    # Kept apart from `artifacts/` because the two have different lifetimes: an
    # artifact is what training produced, a bundle is what one endpoint is
    # serving, and rolling the endpoint back must not mean rewriting artifacts.
    models: models/bundles/

# Local directories each prefix maps to. Kept explicit rather than derived from
# configs/data_pipeline.yaml so a sync can never silently upload the wrong tree.
sync:
  pairs:
    - local: data/processed
      prefix: processed
    - local: data/features
      prefix: features
    - local: data/splits
      prefix: splits
    - local: data/serving
      prefix: serving
    - local: artifacts
      prefix: artifacts
    - local: reports
      prefix: reports

dynamodb:
  # RESOLVED 2026-07-29 against the live table, not assumed: the web repo names
  # its tables `movie-rec-dev-*`, and the interaction sort key is
  # `interaction_key`, not the `interaction_timestamp#movie_id` name spec
  # section 4.3 proposed. Both confirmed with describe-table.
  interactions_table: movie-rec-dev-UserInteractions
  partition_key: user_id
  # Values look like `1997-06-18T03:52:21.000Z#602#rating_<hash>`, so the
  # timestamp is still the part before the first `#` and _sort_key_timestamp()
  # in scripts/export_interactions.py keeps working unchanged.
  sort_key: interaction_key
  # A full Scan reads the whole table and is billed for it. Acceptable at demo
  # scale (a few thousand events); past that, switch the export to a DynamoDB
  # point-in-time export to S3 and point --events at that prefix instead.
  export_mode: scan
  scan_page_size: 1000

  # Backend stores a watch as a progress ratio in one `watch` record, while the
  # model scores `watch` and `complete` as two different signals worth different
  # amounts. The split has to happen somewhere, and here is the only place that
  # sees both conventions. 0.95 rather than 1.0 because a player that stops on
  # the last frame of credits still reports slightly under 1.
  watch_complete_threshold: 0.95

sagemaker:
  # Must be filled before the job can be submitted; the launcher refuses to run
  # with the placeholder rather than failing halfway through with an AWS error.
  #
  # Left empty on purpose -- the ARN carries the account id, which does not
  # belong in git. Set MOVIE_REC_SAGEMAKER_ROLE instead.
  #
  # Check `aws iam get-role --role-name <name>` for a PermissionsBoundary before
  # using a role, not just its attached policies. This account's
  # `SageMakerExecutionRole` looks correct -- AmazonSageMakerFullAccess, right
  # trust policy -- but carries an AmazonS3FullAccess boundary, which caps it at
  # S3 only. With it, endpoint creation failed twice with no CloudWatch logs at
  # all: the role could not pull the container image or create a log group, so
  # nothing ever ran to report why. Use a role whose PermissionsBoundary is null.
  role_arn: ""                        # env: MOVIE_REC_SAGEMAKER_ROLE
  base_job_name: movie-rec-retrain
  # Spec section 4.4 budgets 1-2 USD per run at this size. ALS on the full
  # 12.6M-nonzero matrix fits in memory here; see spec section 7.4.
  instance_type: ml.m5.xlarge
  instance_count: 1
  volume_size_gb: 60
  max_runtime_seconds: 14400
  # Processing Job, never a real-time endpoint: the whole architecture is
  # batch-first and an always-on endpoint is the one line item that could blow
  # the budget (spec section 4.4).
  framework: sklearn
  # Newest scikit-learn base image the SDK offers, chosen for its interpreter
  # rather than its scikit-learn version: the job installs its own dependencies
  # over the base, so what matters is that the container's Python is new enough
  # for them. `1.2-1` is a 2023 image and was the previous value here.
  # `deploy/sagemaker_retrain.py` prints the interpreter it actually got, so the
  # first real run confirms this rather than leaving it assumed.
  framework_version: "1.4-2"
  python_version: py3

  # Real-time endpoint. Unlike everything else here, this one bills by the hour
  # from creation until deletion, whether or not anyone calls it -- so the
  # teardown in `scripts/deploy_endpoint.py --delete` is part of the workflow,
  # not an afterthought.
  #
  # ml.m5.large, not the ml.m5.xlarge above: the Processing Job factorises a
  # 12.6M-nonzero matrix and needs the memory, while serving looks up one row of
  # user_factors and takes a dot product against item_factors. Measured locally,
  # the whole engine loads in ~9 s and answers in under 65 ms; 8 GB is already
  # generous for a 158 MB bundle. Quota checked 2026-07-29: 4 available.
  endpoint:
    name: movie-rec-endpoint
    instance_type: ml.m5.large
    instance_count: 1
    # Not a scikit-learn image, despite this being a scikit-learn model. Every
    # sklearn image with an `inference` scope tops out at 1.2-1, which ships
    # Python 3.9, and the serving path calls `zip(..., strict=True)` -- 3.10 and
    # newer only (src/recommenders/content_based.py, src/recommenders/engine.py).
    # Deployed on 1.2-1 the container died at import with
    # `ImportError: numpy._core.multiarray failed to import`, once pip pulled
    # numpy 2 in under the image's numpy-1-era scipy.
    #
    # The pytorch inference images are the ones AWS still builds on a current
    # interpreter. Nothing here imports torch; the image is used for its Python
    # 3.11, which is the version every local test ran on. Checked 2026-07-29:
    # 2.5.1-cpu-py311 resolves in ap-southeast-1.
    framework: pytorch
    framework_version: "2.5.1"
    python_version: py311

retraining:
  # How an aggregated event score becomes a training signal.
  #
  # build_training_matrix() thresholds on the 0.5-5.0 rating scale, so event
  # scores have to be projected onto it. Piecewise-linear through three anchors:
  #   score <= negative_anchor_score -> minimum_rating
  #   score == 0                     -> neutral_rating
  #   score >= positive_anchor_score -> maximum_rating
  # With the default weights that puts a share or a like at 5.0, a completed
  # watch at ~4.6, a bare click at ~3.3 (neutral, excluded from training) and a
  # hostile comment at ~1.8 (negative, filtered out of recommendations).
  event_rating:
    neutral_rating: 3.0
    positive_anchor_score: 15.0
    negative_anchor_score: -15.0
    minimum_rating: 0.5
    maximum_rating: 5.0

  # Decay is switched off while building training rows. Decay answers "what does
  # this user want today", which is a serving question; training wants the whole
  # observed history weighted the same way every time the job runs. Leaving it
  # on would make the training set depend on the wall clock, and two runs over
  # identical data would produce different models.
  half_life_days: 0

  # A user who both rated a film and interacted with it produces two candidate
  # rows. The explicit rating wins: it is the signal the model was designed
  # around and the only one present in the historical data.
  event_conflict_policy: prefer_rating   # prefer_rating | prefer_event

  evaluation:
    split: test
    sample_users: 5000
    seed: 42

  # A retrained model is not promoted just because it finished. LATEST.json only
  # moves when the candidate clears every gate below; otherwise the artifact is
  # kept for inspection and the pointer stays where it was.
  promotion:
    metric: hit_rate_at_10
    # A personalised model that cannot beat "show everyone the same popular
    # films" has no reason to exist (spec section 15.2).
    must_beat_popularity: true
    # Compared against the metric recorded in the currently promoted manifest.
    # Retraining on fresh data moves this metric around by a few percent run to
    # run; blocking on any decrease at all would never promote anything.
    max_relative_regression: 0.05
    # Below this many scored users the metric is noise, not a measurement.
    minimum_users_scored: 1000
